[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "network-operations-platform"
version = "0.1.0"
description = "Enterprise network compliance platform for NetBox-backed Cisco infrastructure validation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "OpenAI" }]
dependencies = [
    "alembic>=1.13.2",
    "celery>=5.4.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
    "netmiko>=4.4.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.2",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.4.0",
    "psycopg[binary]>=3.2.1",
    "redis>=5.0.8",
    "sqlalchemy>=2.0.34",
    "uvicorn[standard]>=0.30.6",
    "weasyprint>=62.3",
]

[project.optional-dependencies]
dev = [
    "black>=24.8.0",
    "mypy>=1.11.2",
    "pytest>=8.3.2",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.9",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "UP", "ANN", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
mypy_path = "backend"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
